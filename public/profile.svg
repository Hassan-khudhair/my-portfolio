<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  
  <!-- User icon -->
  <g transform="translate(200, 200)" fill="#ffffff">
    <!-- Head -->
    <circle cx="0" cy="-40" r="45"/>
    <!-- Body -->
    <path d="M -70 120 Q -70 20 -45 0 Q 0 -20 45 0 Q 70 20 70 120 Z"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    ADD YOUR PHOTO
  </text>
</svg>
